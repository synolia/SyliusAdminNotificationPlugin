
framework:
    notifier:
        chatter_transports:
            admin_notification: 'adminnotification://null'

sylius_grid:
    grids:
        synolia_sylius_admin_notification:
            driver:
                name: doctrine/orm
                options:
                    class: '%synolia_sylius_admin_notification.model.admin_notification.class%'
            sorting:
                createdAt: desc
                channel: asc
            limits: [10, 25, 50, 100]
            fields:
                createdAt:
                    type: datetime
                    label: sylius.ui.created_at
                    sortable: true
                    enabled: true
                channel:
                    type: string
                    label: sylius.ui.channel
                    sortable: true
                    enabled: false
                message:
                    type: string
                    label: synolia_sylius_admin_notification.ui.message
                    sortable: true
                    enabled: true
                levelName:
                    type: string
                    label: synolia_sylius_admin_notification.ui.level_name
                    sortable: true
                    enabled: true
                context:
                    type: string
                    label: synolia_sylius_admin_notification.ui.level_name
                    sortable: true
                    enabled: false
            filters:
                levelName:
                    type: select
                    enabled: true
                    label: synolia_sylius_admin_notification.ui.level_name
                    form_options:
                        choices:
                            synolia_sylius_admin_notification.ui.levels.debug: DEBUG
                            synolia_sylius_admin_notification.ui.levels.info: INFO
                            synolia_sylius_admin_notification.ui.levels.notice: NOTICE
                            synolia_sylius_admin_notification.ui.levels.warning: WARNING
                            synolia_sylius_admin_notification.ui.levels.error: ERROR
                            synolia_sylius_admin_notification.ui.levels.critical: CRITICAL
                            synolia_sylius_admin_notification.ui.levels.alert: ALERT
                            synolia_sylius_admin_notification.ui.levels.emergency: EMERGENCY
                    default_value: ~
                message:
                    type: string
                    label: synolia_sylius_admin_notification.ui.message
                    enabled: true
                    default_value: ~
                context:
                    type: string
                    label: synolia_sylius_admin_notification.ui.context
                    enabled: true
                    default_value: ~
            actions:
                item:
                    show:
                        type: show
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
                        label: sylius.ui.delete
                        enabled: true
                        position: 100
                        options: { }
