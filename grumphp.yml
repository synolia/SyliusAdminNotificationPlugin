grumphp:
    ascii:
        failed: ~
        succeeded: ~
    ignore_unstaged_changes: true
    tasks:
        composer:
            file: "composer.json"
            no_check_all: true
        jsonlint:
            detect_key_conflicts: true
        phpcs:
            standard: "ruleset"
            warning_severity: 0
            whitelist_patterns:
                - "src"
                - "tests"
        phpcsfixer2:
            config: 'ruleset/.php-cs-fixer.php'
            verbose: true
            diff: true
            triggered_by: ['php']
        phplint:
            exclude: ['vendor']
            triggered_by: ['php']
        phpmd:
            ruleset: ["ruleset/.php_md.xml"]
            exclude: ["tests/*", "migrations/*", "src/Kernel.php", "*/migrations/*"]
        phpmnd:
            directory: "src"
        phpstan:
            level: ~
            configuration: "ruleset/phpstan.neon"
        xmllint: ~
        yamllint:
            parse_custom_tags: true
